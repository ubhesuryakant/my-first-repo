<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 80px 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #0001;
        }

        h1 { color: #2563eb; }

        a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Website!</h1>
        <p>My first HTML project using Git and GitHub.</p>
        <a href="https://github.com/">Visit GitHub</a>
    </div>
</body>
</html>
